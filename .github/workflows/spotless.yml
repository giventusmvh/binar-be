name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  spotless:
    name: Check Code Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run Spotless Check
        run: |
          for i in 1 2 3; do
            mvn spotless:check --no-transfer-progress && break
            echo "Attempt $i failed, retrying in 30 seconds..."
            sleep 30
          done

  unit-test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: spotless

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run Unit Tests
        run: |
          for i in 1 2 3; do
            mvn test --no-transfer-progress && break
            echo "Attempt $i failed, retrying in 30 seconds..."
            sleep 30
          done

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
