spring.application.name=binar-be

# SQL Server Configuration
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=binar-be;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:StrongPass123!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# JWT Configuration (Base64 encoded secret for JJWT 0.12.x)
jwt.secret=${JWT_SECRET:YmluYXItYmUtbG9hbi1hcHBsaWNhdGlvbi1zZWNyZXQta2V5LTIwMjQtdGhpcy1pcy1hLXZlcnktc2VjdXJlLWtleS1mb3Itand0LXNpZ25pbmctbWluaW11bS0yNTYtYml0cw==}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:DEBUG}
logging.level.com.gvn.binarbe=${LOG_LEVEL_APP:DEBUG}

# Email Configuration
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:73b26d3ab7aa6e}
spring.mail.password=${MAIL_PASSWORD:bcc8252b75c872}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.password=${REDIS_PASSWORD:}

# Password Reset Configuration
app.password-reset.token-expiry-minutes=${PASSWORD_RESET_EXPIRY:30}
app.password-reset.base-url=${PASSWORD_RESET_BASE_URL:http://localhost:4200/reset-password}
app.file-storage.upload-dir=${FILE_UPLOAD_DIR:uploads}

# Firebase Configuration
# Path to Firebase service account JSON file for Admin SDK
# This file is used for Firebase Authentication and Push Notifications
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:src/main/resources/firebase-service-account.json}
