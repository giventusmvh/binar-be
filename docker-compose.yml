services:
  # Spring Boot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_CONTAINER_NAME:-binar-be-app}
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://${DB_HOST:-sqlserver}:${DB_PORT:-1433};databaseName=${DB_NAME:-binar-be};encrypt=true;trustServerCertificate=true
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-sa}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-StrongPass123!}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST:-redis}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}
      - JWT_SECRET=${JWT_SECRET:-YmluYXItYmUtbG9hbi1hcHBsaWNhdGlvbi1zZWNyZXQta2V5LTIwMjQtdGhpcy1pcy1hLXZlcnktc2VjdXJlLWtleS1mb3Itand0LXNpZ25pbmctbWluaW11bS0yNTYtYml0cw==}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - SPRING_MAIL_HOST=${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      - SPRING_MAIL_PORT=${MAIL_PORT:-2525}
      - SPRING_MAIL_USERNAME=${MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD}
      - APP_PASSWORD_RESET_BASE_URL=${PASSWORD_RESET_BASE_URL:-http://localhost:4200/reset-password}
      - FILE_UPLOAD_DIR=/app/uploads
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - binar-network
    restart: unless-stopped

  # Microsoft SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ${DB_CONTAINER_NAME:-binar-be-sqlserver}
    ports:
      - "${DB_EXTERNAL_PORT:-1433}:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:-StrongPass123!}
      - MSSQL_PID=${MSSQL_PID:-Express}
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - binar-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${DB_PASSWORD:-StrongPass123!}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-binar-be-redis}
    ports:
      - "${REDIS_EXTERNAL_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    networks:
      - binar-network
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    restart: unless-stopped

networks:
  binar-network:
    driver: bridge

volumes:
  sqlserver-data:
    driver: local
  redis-data:
    driver: local
  uploads-data:
    driver: local
